# XcodeGen spec: `xcodegen generate` turns it into FurkVPN.xcodeproj (the project file is not kept in git).
# Frameworks/Libxray.xcframework is Xray-core built by gomobile from core/ (see build.sh); Go's
# runtime needs libresolv, Security and CoreFoundation linked next to it.
# The same targets build for the Mac (Mac Catalyst, build-mac.sh) with the iOS bundle ids, so the App Store
# sells both as one app; the Mac needs the App Sandbox, hence its own entitlements.
name: FurkVPN
options:
  bundleIdPrefix: com.furkvpn
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.2"
    CURRENT_PROJECT_VERSION: "19"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES
targets:
  FurkVPN:
    type: application
    platform: iOS
    sources: [FurkVPN, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkvpn.app
        PRODUCT_NAME: FurkVPN
        INFOPLIST_FILE: FurkVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: FurkVPN/FurkVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FurkVPN/FurkVPN-mac.entitlements
        # ControlIntent.swift is built into FurkWidget too; only the app's copy switches the VPN.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FURK_APP"
    dependencies:
      - target: FurkTunnel
      # The Control Center button (iOS 18); not on the Mac.
      - target: FurkWidget
        platformFilter: iOS
      - framework: Frameworks/Libxray.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
  FurkTunnel:
    type: app-extension
    platform: iOS
    sources: [FurkTunnel, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkvpn.app.tunnel
        PRODUCT_NAME: FurkTunnel
        INFOPLIST_FILE: FurkTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: FurkTunnel/FurkTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": FurkTunnel/FurkTunnel-mac.entitlements
    dependencies:
      - framework: Frameworks/Libxray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
  FurkWidget:
    type: app-extension
    platform: iOS
    # Controls are iOS 18; the extension simply isn't loaded on older versions.
    deploymentTarget: "18.0"
    sources: [FurkWidget, FurkVPN/ControlIntent.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkvpn.app.widget
        PRODUCT_NAME: FurkWidget
        INFOPLIST_FILE: FurkWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  FurkVPN:
    build:
      targets:
        FurkVPN: all
